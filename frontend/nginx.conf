server {
    listen 80;

    # Re-resolve `beff` via Docker's embedded DNS instead of once at startup,
    # so recreating the beff container (new IP) doesn't leave nginx pointing
    # at a stale address. Using a variable in proxy_pass is what forces the
    # per-request lookup; the original request URI is still forwarded as-is.
    resolver 127.0.0.11 valid=10s;
    set $beff http://beff:3001;

    location /api/ {
        proxy_pass         $beff;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass         $beff;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass         $beff;
        proxy_http_version 1.1;
    }

    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
